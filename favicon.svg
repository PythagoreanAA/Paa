<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512"
     role="img"
     aria-label="PAA Tetraktys">

  <defs>

    <!-- =====================================================
         PAA PALETTE
         Tyrian Purple + Lapis Lazuli + Turquoise
         ===================================================== -->

    <!-- Tyrian metal -->
    <linearGradient id="tyrian"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%"   stop-color="#3b0a2a"/>
      <stop offset="28%"  stop-color="#641b46"/>
      <stop offset="55%"  stop-color="#8b2f68"/>
      <stop offset="78%"  stop-color="#641b46"/>
      <stop offset="100%" stop-color="#310820"/>
    </linearGradient>

    <!-- Deep Lapis → Turquoise -->
    <linearGradient id="lapis"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%"   stop-color="#102f5c"/>
      <stop offset="32%"  stop-color="#173f72"/>
      <stop offset="62%"  stop-color="#176b88"/>
      <stop offset="84%"  stop-color="#1b9baa"/>
      <stop offset="100%" stop-color="#58d6df"/>
    </linearGradient>

    <!-- Combined ceremonial gradient -->
    <linearGradient id="ceremonial"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%"   stop-color="#641b46"/>
      <stop offset="28%"  stop-color="#8b2f68"/>
      <stop offset="52%"  stop-color="#173f72"/>
      <stop offset="76%"  stop-color="#1b9baa"/>
      <stop offset="100%" stop-color="#58d6df"/>
    </linearGradient>

    <!-- Ordinary Tetraktys pearls -->
    <radialGradient id="pearl"
                    cx="34%"
                    cy="28%"
                    r="72%">
      <stop offset="0%"   stop-color="#f5ffff"/>
      <stop offset="18%"  stop-color="#b9f3f2"/>
      <stop offset="42%"  stop-color="#58d6df"/>
      <stop offset="68%"  stop-color="#1b9baa"/>
      <stop offset="86%"  stop-color="#173f72"/>
      <stop offset="100%" stop-color="#641b46"/>
    </radialGradient>

    <!--
         MONAD
         Deliberately brighter and larger than every other point.
    -->
    <radialGradient id="monad"
                    cx="38%"
                    cy="30%"
                    r="68%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="16%"  stop-color="#efffff"/>
      <stop offset="36%"  stop-color="#9af3ee"/>
      <stop offset="60%"  stop-color="#36c7cf"/>
      <stop offset="82%"  stop-color="#176b88"/>
      <stop offset="100%" stop-color="#641b46"/>
    </radialGradient>

    <!-- Restrained blue line glow -->
    <filter id="lineGlow"
            x="-40%" y="-40%"
            width="180%" height="180%">
      <feGaussianBlur stdDeviation="2"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Ordinary point glow -->
    <filter id="pointGlow"
            x="-80%" y="-80%"
            width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger Monad glow -->
    <filter id="monadGlow"
            x="-150%" y="-150%"
            width="400%" height="400%">
      <feGaussianBlur stdDeviation="8"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- =====================================================
       WHITE FIELD
       ===================================================== -->

  <rect width="512"
        height="512"
        fill="#ffffff"/>


  <!-- =====================================================
       OUTER SEAL
       ===================================================== -->

  <circle cx="256"
          cy="256"
          r="218"
          fill="none"
          stroke="url(#ceremonial)"
          stroke-width="5"/>

  <circle cx="256"
          cy="256"
          r="207"
          fill="none"
          stroke="#173f72"
          stroke-opacity=".20"
          stroke-width="1.5"/>


  <!-- =====================================================
       FOUR CARDINAL MARKS
       ===================================================== -->

  <g fill="url(#tyrian)">

    <!-- North -->
    <path d="
      M256 16
      L260 38
      L256 69
      L252 38
      Z"/>

    <!-- South -->
    <path d="
      M256 496
      L252 474
      L256 443
      L260 474
      Z"/>

    <!-- West -->
    <path d="
      M16 256
      L38 252
      L69 256
      L38 260
      Z"/>

    <!-- East -->
    <path d="
      M496 256
      L474 260
      L443 256
      L474 252
      Z"/>

  </g>


  <!-- =====================================================
       TETRAKTYS NETWORK
       Deep lapis / turquoise structural lines only.
       ===================================================== -->

  <g fill="none"
     stroke="url(#lapis)"
     stroke-width="3"
     stroke-linecap="round"
     stroke-linejoin="round"
     filter="url(#lineGlow)">

    <!-- OUTER TRIANGLE -->
    <path d="
      M256 112
      L116 390
      L396 390
      Z"/>


    <!-- LEVEL 2 -->
    <path d="
      M209 205
      L303 205"/>


    <!-- LEVEL 3 -->
    <path d="
      M162 298
      L256 298
      L350 298"/>


    <!-- LEVEL 4 -->
    <path d="
      M116 390
      L209 390
      L303 390
      L396 390"/>


    <!-- MONAD → DYAD -->
    <path d="M256 112 L209 205"/>
    <path d="M256 112 L303 205"/>


    <!-- DYAD → TRIAD -->
    <path d="M209 205 L162 298"/>
    <path d="M209 205 L256 298"/>

    <path d="M303 205 L256 298"/>
    <path d="M303 205 L350 298"/>


    <!-- TRIAD → TETRAD -->
    <path d="M162 298 L116 390"/>
    <path d="M162 298 L209 390"/>

    <path d="M256 298 L209 390"/>
    <path d="M256 298 L303 390"/>

    <path d="M350 298 L303 390"/>
    <path d="M350 298 L396 390"/>

  </g>


  <!-- =====================================================
       ORDINARY NINE POINTS
       Enlarged from r=17 to r=22
       ===================================================== -->

  <g fill="url(#pearl)"
     stroke="#641b46"
     stroke-width="2.5"
     filter="url(#pointGlow)">

    <!-- TWO -->
    <circle cx="209"
            cy="205"
            r="22"/>

    <circle cx="303"
            cy="205"
            r="22"/>


    <!-- THREE -->
    <circle cx="162"
            cy="298"
            r="22"/>

    <circle cx="256"
            cy="298"
            r="22"/>

    <circle cx="350"
            cy="298"
            r="22"/>


    <!-- FOUR -->
    <circle cx="116"
            cy="390"
            r="22"/>

    <circle cx="209"
            cy="390"
            r="22"/>

    <circle cx="303"
            cy="390"
            r="22"/>

    <circle cx="396"
            cy="390"
            r="22"/>

  </g>


  <!-- =====================================================
       MONAD
       ONE / UNITY / SOURCE
       Enlarged and intentionally dominant
       ===================================================== -->

  <!-- Monad aura -->
  <circle cx="256"
          cy="112"
          r="38"
          fill="#58d6df"
          opacity=".13"
          filter="url(#monadGlow)"/>


  <!-- Monad rays -->
  <g stroke="#641b46"
     stroke-linecap="round"
     opacity=".72">

    <path d="M256 69 L256 78"
          stroke-width="2"/>

    <path d="M256 146 L256 155"
          stroke-width="2"/>

    <path d="M213 112 L222 112"
          stroke-width="2"/>

    <path d="M290 112 L299 112"
          stroke-width="2"/>

  </g>


  <!-- Monad diagonal rays -->
  <g stroke="#1b9baa"
     stroke-linecap="round"
     opacity=".52">

    <path d="M226 82 L232 88"/>
    <path d="M280 136 L286 142"/>

    <path d="M286 82 L280 88"/>
    <path d="M232 136 L226 142"/>

  </g>


  <!-- Monad body -->
  <circle cx="256"
          cy="112"
          r="27"
          fill="url(#monad)"
          stroke="#641b46"
          stroke-width="3"
          filter="url(#monadGlow)"/>


  <!-- White source -->
  <circle cx="248"
          cy="104"
          r="7"
          fill="#ffffff"
          opacity=".96"/>


  <!-- =====================================================
       SUBTLE POINT HIGHLIGHTS
       Repositioned slightly for larger pearls
       ===================================================== -->

  <g fill="#ffffff"
     opacity=".82">

    <circle cx="202" cy="198" r="4"/>
    <circle cx="296" cy="198" r="4"/>

    <circle cx="155" cy="291" r="4"/>
    <circle cx="249" cy="291" r="4"/>
    <circle cx="343" cy="291" r="4"/>

    <circle cx="109" cy="383" r="4"/>
    <circle cx="202" cy="383" r="4"/>
    <circle cx="296" cy="383" r="4"/>
    <circle cx="389" cy="383" r="4"/>

  </g>

</svg>
