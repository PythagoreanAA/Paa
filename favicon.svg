<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512"
     role="img"
     aria-label="PAA Tetraktys">

  <defs>
    <!-- Deep nocturnal field -->
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#10283d"/>
      <stop offset="55%" stop-color="#081827"/>
      <stop offset="100%" stop-color="#030913"/>
    </radialGradient>

    <!-- Solar metal -->
    <linearGradient id="solar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="22%" stop-color="#ffe39a"/>
      <stop offset="52%" stop-color="#f2c96d"/>
      <stop offset="76%" stop-color="#e69b4a"/>
      <stop offset="100%" stop-color="#d75f76"/>
    </linearGradient>

    <!-- Individual pearl / solar point -->
    <radialGradient id="pearl" cx="35%" cy="27%" r="70%">
      <stop offset="0%" stop-color="#fffdf0"/>
      <stop offset="24%" stop-color="#fff0b8"/>
      <stop offset="58%" stop-color="#f2c96d"/>
      <stop offset="82%" stop-color="#e69b4a"/>
      <stop offset="100%" stop-color="#c95d70"/>
    </radialGradient>

    <!-- Outer ring glow -->
    <filter id="ringGlow"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot glow -->
    <filter id="dotGlow"
            x="-100%" y="-100%"
            width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft central aura -->
    <radialGradient id="aura">
      <stop offset="0%" stop-color="#f2c96d"
            stop-opacity=".13"/>
      <stop offset="55%" stop-color="#d75f9a"
            stop-opacity=".04"/>
      <stop offset="100%" stop-color="#07111f"
            stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512"
        height="512"
        rx="92"
        fill="url(#bg)"/>

  <!-- Central atmospheric illumination -->
  <circle cx="256"
          cy="250"
          r="205"
          fill="url(#aura)"/>

  <!-- =====================================================
       OUTER SOLAR SEAL
       ===================================================== -->

  <circle cx="256"
          cy="256"
          r="218"
          fill="none"
          stroke="#f2c96d"
          stroke-opacity=".18"
          stroke-width="15"/>

  <circle cx="256"
          cy="256"
          r="218"
          fill="none"
          stroke="url(#solar)"
          stroke-width="4"
          filter="url(#ringGlow)"/>

  <circle cx="256"
          cy="256"
          r="203"
          fill="none"
          stroke="#ffe39a"
          stroke-opacity=".48"
          stroke-width="1.5"/>

  <!-- Cardinal rays -->
  <g stroke="url(#solar)"
     stroke-linecap="round"
     filter="url(#ringGlow)">

    <path d="M256 12 L256 75"
          stroke-width="3"/>

    <path d="M256 437 L256 500"
          stroke-width="3"/>

    <path d="M12 256 L75 256"
          stroke-width="3"/>

    <path d="M437 256 L500 256"
          stroke-width="3"/>

  </g>

  <!-- Small cardinal stars -->
  <g fill="#fff4c7"
     filter="url(#dotGlow)">

    <circle cx="256" cy="39" r="3"/>
    <circle cx="256" cy="473" r="3"/>
    <circle cx="39" cy="256" r="3"/>
    <circle cx="473" cy="256" r="3"/>

  </g>

  <!-- =====================================================
       SACRED CONSTRUCTION
       ===================================================== -->

  <g fill="none"
     stroke="#f2c96d"
     stroke-opacity=".22"
     stroke-width="1.5">

    <circle cx="256"
            cy="256"
            r="164"/>

    <path d="M256 105
             L112 385
             L400 385
             Z"/>

  </g>

  <!-- Tetraktys connecting structure -->
  <g fill="none"
     stroke="url(#solar)"
     stroke-opacity=".62"
     stroke-width="2">

    <!-- Outer triangle -->
    <path d="M256 123
             L132 377
             L380 377
             Z"/>

    <!-- Horizontal levels -->
    <path d="M215 208 L297 208"/>
    <path d="M174 292 L338 292"/>
    <path d="M132 377 L380 377"/>

  </g>

  <!-- =====================================================
       THE TETRAKTYS
       1 + 2 + 3 + 4 = 10
       ===================================================== -->

  <g fill="url(#pearl)"
     stroke="#fff0b0"
     stroke-width="2"
     filter="url(#dotGlow)">

    <!-- ONE -->
    <circle cx="256"
            cy="123"
            r="18"/>

    <!-- TWO -->
    <circle cx="215"
            cy="208"
            r="18"/>

    <circle cx="297"
            cy="208"
            r="18"/>

    <!-- THREE -->
    <circle cx="174"
            cy="292"
            r="18"/>

    <circle cx="256"
            cy="292"
            r="18"/>

    <circle cx="338"
            cy="292"
            r="18"/>

    <!-- FOUR -->
    <circle cx="132"
            cy="377"
            r="18"/>

    <circle cx="215"
            cy="377"
            r="18"/>

    <circle cx="297"
            cy="377"
            r="18"/>

    <circle cx="380"
            cy="377"
            r="18"/>

  </g>

  <!-- White-hot centers preserve legibility at favicon scale -->
  <g fill="#fffbe9"
     opacity=".82">

    <circle cx="250" cy="117" r="4"/>

    <circle cx="209" cy="202" r="4"/>
    <circle cx="291" cy="202" r="4"/>

    <circle cx="168" cy="286" r="4"/>
    <circle cx="250" cy="286" r="4"/>
    <circle cx="332" cy="286" r="4"/>

    <circle cx="126" cy="371" r="4"/>
    <circle cx="209" cy="371" r="4"/>
    <circle cx="291" cy="371" r="4"/>
    <circle cx="374" cy="371" r="4"/>

  </g>

</svg>
